<style>
        :root {
            --black: #0a0a0a;
            --gray-900: #1a1a1a;
            --gray-700: #404040;
            --gray-500: #6b6b6b;
            --gray-400: #8a8a8a;
            --gray-300: #b0b0b0;
            --gray-200: #e5e5e5;
            --gray-100: #f5f5f5;
            --white: #ffffff;
            --accent: #0066ff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--white);
            color: var(--gray-900);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        .nav {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--gray-200);
            z-index: 1000;
        }
        .nav-inner {
            max-width: 1120px; margin: 0 auto; padding: 0 32px;
            display: flex; align-items: center; justify-content: space-between; height: 64px;
        }
        .nav-logo { font-weight: 700; font-size: 18px; color: var(--black); text-decoration: none; letter-spacing: -0.5px; }
        .nav-logo em { font-style: normal; color: var(--accent); }
        /* Hamburger button */
        .nav-hamburger { display: none; background: none; border: none; cursor: pointer; padding: 8px; z-index: 1002; }
        .nav-hamburger span { display: block; width: 20px; height: 2px; background: var(--gray-700); margin: 4px 0; transition: transform 0.25s, opacity 0.25s; }
        .nav-hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(4px, 4px); }
        .nav-hamburger.active span:nth-child(2) { opacity: 0; }
        .nav-hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
        .nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
        .nav-links a { font-size: 14px; font-weight: 500; color: var(--gray-500); text-decoration: none; }
        .nav-links a:hover { color: var(--black); }
        
        /* Hero */
        .about-hero {
            padding: 140px 32px 80px;
            max-width: 1120px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }
        
        .about-hero-content h1 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: clamp(36px, 5vw, 52px);
            font-weight: 500;
            line-height: 1.15;
            color: var(--black);
            letter-spacing: -1px;
            margin-bottom: 24px;
        }
        
        .about-hero-content p {
            font-size: 18px;
            color: var(--gray-500);
            line-height: 1.7;
            margin-bottom: 16px;
        }
        
        .about-hero-image {
            aspect-ratio: 3/4;
            border-radius: 12px;
            overflow: hidden;
            background: var(--gray-100);
        }
        
        .about-hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Stats */
        .about-stats {
            max-width: 1120px;
            margin: 0 auto;
            padding: 60px 32px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            border-top: 1px solid var(--gray-200);
            border-bottom: 1px solid var(--gray-200);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 48px;
            font-weight: 500;
            color: var(--black);
            letter-spacing: -1px;
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--gray-400);
            margin-top: 8px;
        }
        
        /* Journey */
        .about-journey {
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 32px;
        }
        
        .about-journey h2 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 32px;
            font-weight: 500;
            color: var(--black);
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }
        
        .about-journey p {
            font-size: 17px;
            color: var(--gray-700);
            line-height: 1.8;
            margin-bottom: 24px;
        }
        
        .timeline {
            margin: 48px 0;
        }
        
        .timeline-item {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 32px;
            padding: 32px 0;
            border-bottom: 1px solid var(--gray-200);
        }
        
        .timeline-year {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--accent);
        }
        
        .timeline-content h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--black);
            margin-bottom: 8px;
        }
        
        .timeline-content p {
            font-size: 15px;
            color: var(--gray-500);
            margin: 0;
        }
        
        /* Values */
        .about-values {
            background: var(--gray-100);
            padding: 80px 32px;
        }
        
        .about-values-inner {
            max-width: 1120px;
            margin: 0 auto;
        }
        
        .about-values h2 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 32px;
            font-weight: 500;
            color: var(--black);
            margin-bottom: 48px;
            text-align: center;
        }
        
        .values-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }
        
        .value-card {
            background: var(--white);
            padding: 32px;
            border-radius: 8px;
        }
        
        .value-card h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--black);
            margin-bottom: 12px;
        }
        
        .value-card p {
            font-size: 15px;
            color: var(--gray-500);
            line-height: 1.7;
            margin: 0;
        }
        
        /* CTA */
        .about-cta {
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 32px;
            text-align: center;
        }
        
        .about-cta h2 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 32px;
            font-weight: 500;
            color: var(--black);
            margin-bottom: 16px;
        }
        
        .about-cta p {
            font-size: 17px;
            color: var(--gray-500);
            margin-bottom: 32px;
        }
        
        .about-cta a {
            display: inline-block;
            background: var(--accent);
            color: var(--white);
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.15s;
        }
        
        .about-cta a:hover {
            background: #0052cc;
        }
        
        /* Footer */
        .footer { background: var(--gray-900); color: var(--white); padding: 64px 32px 32px; }
        .footer-inner { max-width: 1120px; margin: 0 auto; }
        .footer-main { display: grid; grid-template-columns: 1.2fr 2fr; gap: 64px; padding-bottom: 48px; border-bottom: 1px solid var(--gray-700); }
        .footer-logo { font-weight: 700; font-size: 24px; color: var(--white); text-decoration: none; }
        .footer-logo em { font-style: normal; color: var(--accent); }
        .footer-desc { font-size: 14px; color: var(--gray-400); line-height: 1.6; margin-top: 16px; max-width: 280px; }
        .footer-author { display: flex; align-items: center; gap: 12px; margin-top: 24px; font-size: 14px; }
        .footer-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
        .footer-author small { color: var(--gray-400); font-size: 12px; }
        .footer-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
        .footer-col h4 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--white); margin-bottom: 20px; }
        .footer-col ul { list-style: none; }
        .footer-col li { margin-bottom: 12px; }
        .footer-col a { font-size: 14px; color: var(--gray-400); text-decoration: none; transition: color 0.15s; }
        .footer-col a:hover { color: var(--white); }
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 32px; font-size: 13px; color: var(--gray-400); }
        .footer-legal { display: flex; gap: 24px; list-style: none; }
        .footer-legal a { color: var(--gray-400); text-decoration: none; }
        .footer-legal a:hover { color: var(--white); }
        
        @media (max-width: 968px) {
            .about-hero {
                grid-template-columns: 1fr;
                gap: 48px;
            }
            .about-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .values-grid {
                grid-template-columns: 1fr;
            }
            .footer-main {
                grid-template-columns: 1fr;
                gap: 48px;
            }
            .footer-nav {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 640px) {
            .nav-links { display: none; }
            .about-hero, .about-journey, .about-cta { padding-left: 20px; padding-right: 20px; }
            .about-stats { grid-template-columns: 1fr; padding: 40px 20px; }
            .timeline-item { grid-template-columns: 1fr; gap: 8px; }
            .footer-nav { grid-template-columns: 1fr; }
            .footer-bottom { flex-direction: column; gap: 16px; text-align: center; }
        }
    </style>
