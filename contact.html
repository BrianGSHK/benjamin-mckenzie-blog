<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Benjamin McKenzie</title>
    <link rel="canonical" href="https://benjaminmckenzie.com/contact">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <script>
        window.onload = function() {
            window.location.href = "mailto:info@benjaminmckenzie.com?subject=Company%20Formation%20Enquiry";
        };
    </script>
    
    <style>
        :root {
            --black: #0a0a0a;
            --gray-900: #1a1a1a;
            --gray-700: #404040;
            --gray-500: #6b6b6b;
            --gray-400: #8a8a8a;
            --gray-300: #b0b0b0;
            --gray-200: #e5e5e5;
            --gray-100: #f5f5f5;
            --white: #ffffff;
            --accent: #0066ff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--white);
            color: var(--gray-900);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        
        .logo {
            font-weight: 700;
            font-size: 24px;
            color: var(--black);
            text-decoration: none;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
            display: inline-block;
        }
        
        .logo em {
            font-style: normal;
            color: var(--accent);
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: var(--gray-100);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
        }
        
        .icon svg {
            width: 36px;
            height: 36px;
            fill: var(--accent);
        }
        
        h1 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 32px;
            font-weight: 500;
            color: var(--black);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }
        
        p {
            font-size: 16px;
            color: var(--gray-500);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .email-btn {
            display: inline-block;
            background: var(--accent);
            color: var(--white);
            padding: 16px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.15s;
        }
        
        .email-btn:hover {
            background: #0052cc;
        }
        
        .fallback {
            margin-top: 24px;
            font-size: 14px;
            color: var(--gray-400);
        }
        
        .fallback a {
            color: var(--accent);
            text-decoration: none;
        }
        
        .footer {
            margin-top: 64px;
            font-size: 13px;
            color: var(--gray-400);
        }
        
        .footer a {
            color: var(--gray-700);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="logo">Benjamin<em>.</em></a>
        
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </div>
        
        <h1>Contact Benjamin</h1>
        <p>Opening your email app to send a message to info@benjaminmckenzie.com</p>
        
        <a href="mailto:info@benjaminmckenzie.com?subject=Company%20Formation%20Enquiry" class="email-btn">Open Email App</a>
        
        <p class="fallback">If your email app didn't open, <a href="mailto:info@benjaminmckenzie.com?subject=Company%20Formation%20Enquiry">click here</a></p>
        
        <div class="footer">
            <a href="/">← Back to Benjamin McKenzie</a>
        </div>
    </div>
<script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        if (navToggle) {
            navToggle.addEventListener('click', () => {
                navToggle.classList.toggle('active');
                navLinks.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
